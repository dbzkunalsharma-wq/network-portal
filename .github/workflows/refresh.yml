name: Refresh Network Portal jobs

# Runs in GitHub's cloud (independent of any PC): scrape every source, rebuild
# web/public/jobs.json, commit it (keeps the schedule alive + versions the data),
# and redeploy the live Vercel site via a token.
on:
  schedule:
    # Twice a day, US-friendly: 6 AM and 4 PM Central (11:00 / 21:00 UTC). GitHub's
    # scheduled runs are best-effort and often start 15-90 min late.
    - cron: "0 11 * * *"
    - cron: "0 21 * * *"
  workflow_dispatch: {}       # manual / test runs from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Scrape + classify all sources
        run: python poll.py --seed

      - name: Export feed (web/public/jobs.json)
        run: python export.py

      - name: Build company ledger (web/public/companies-ledger.json)
        run: python ledger.py

      - name: Commit refreshed feed
        run: |
          git config user.name "netportal-bot"
          git config user.email "netportal-bot@users.noreply.github.com"
          git add web/public/jobs.json web/public/stats-history.json web/public/companies-ledger.json
          git commit -m "chore: job-feed refresh" || echo "no changes to commit"
          git pull --rebase || true
          git push || echo "nothing to push"

      - name: Deploy to Vercel (production)
        if: ${{ env.VERCEL_PROJECT_ID != '' }}
        working-directory: web
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npm install -g vercel@latest
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel deploy --prod --token="$VERCEL_TOKEN"
